name: Nix

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Use exactly the nixpkgs the flake pins, not a channel.
      - name: Resolve pinned nixpkgs
        id: nixpkgs
        run: echo "url=https://github.com/NixOS/nixpkgs/archive/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock).tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=${{ steps.nixpkgs.outputs.url }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds the operator, evaluates the devshell and runs the format check.
      - name: Run flake check
        run: nix flake check --print-build-logs
